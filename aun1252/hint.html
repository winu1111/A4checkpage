<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>めぐる｜ヒント</title>


<style>

/* =========================
   全体
========================= */

body{
  margin:0;
  background:#ffffff;
  font-family:sans-serif;
  color:#333;
}

.wrapper{
  max-width:700px;
  margin:0 auto;
  padding:30px 20px;
}

.title{
  text-align:center;
  margin-bottom:30px;
}


/* =========================
   大きなヒント
========================= */

.hint{
  margin-bottom:15px;

  border:2px solid #333;
  border-radius:12px;

  overflow:hidden;

  background:white;
}


/* ヒントのタイトル */

.hint-header{

  width:100%;

  padding:18px 20px;

  box-sizing:border-box;

  background:#f5f5f5;

  border:none;

  font-size:18px;

  text-align:left;

  cursor:pointer;

  display:flex;

  justify-content:space-between;

  align-items:center;
}


/* ＋と− */

.arrow{
  font-size:20px;
}


/* =========================
   大きなヒントの中身
========================= */

.hint-content{

  max-height:0;

  overflow:hidden;

  padding:0 20px;

  transition:
    max-height 0.5s ease,
    padding 0.5s ease;
}


/* 開いた状態 */

.hint.open .hint-content{

  max-height:1000px;

  padding:20px;
}


/* =========================
   ヒント内ヒント
========================= */

.subhint{

  margin-top:15px;

  border:1px solid #aaa;

  border-radius:10px;

  overflow:hidden;

  background:#fff;
}


/* ヒント内ヒントのタイトル */

.subhint-header{

  width:100%;

  padding:13px 15px;

  box-sizing:border-box;

  background:#fafafa;

  border:none;

  font-size:15px;

  text-align:left;

  cursor:pointer;

  display:flex;

  justify-content:space-between;

  align-items:center;
}


/* ヒント内ヒントの＋− */

.subhint-arrow{
  font-size:18px;
}


/* ヒント内ヒントの中身 */

.subhint-content{

  max-height:0;

  overflow:hidden;

  padding:0 15px;

  transition:
    max-height 0.4s ease,
    padding 0.4s ease;
}


/* 開いた状態 */

.subhint.open .subhint-content{

  max-height:500px;

  padding:15px;
}


/* =========================
   スマホ対応
========================= */

@media screen and (max-width:768px){

  .wrapper{
    padding:20px 15px;
  }

  .hint-header{
    font-size:16px;
    padding:16px;
  }

  .hint.open .hint-content{
    padding:15px;
  }

  .subhint-header{
    font-size:14px;
  }

}

</style>

</head>


<body>


<div class="wrapper">


<h1 class="title">
ヒント
</h1>


<!-- ==================================
     ヒント1
================================== -->

<div class="hint">


  <!-- ヒント1のタイトル -->

  <button
    class="hint-header"
    onclick="toggleHint(this)"
  >

    <span>ヒント1</span>

    <span class="arrow">＋</span>

  </button>


  <!-- ヒント1の中身 -->

  <div class="hint-content">

    <p>
      まずは問題文をもう一度よく読んでみよう。
    </p>


    <!-- ヒント1の中のヒント -->

    <div class="subhint">


      <button
        class="subhint-header"
        onclick="toggleSubHint(this)"
      >

        <span>もう少しヒント</span>

        <span class="subhint-arrow">＋</span>

      </button>


      <div class="subhint-content">

        <p>
          特に文字の並び方に注目してみよう。
        </p>

      </div>

    </div>


    <!-- さらにもう一つ -->

    <div class="subhint">


      <button
        class="subhint-header"
        onclick="toggleSubHint(this)"
      >

        <span>さらにヒント</span>

        <span class="subhint-arrow">＋</span>

      </button>


      <div class="subhint-content">

        <p>
          文字の形にも何か意味があるかもしれないぞ。
        </p>

      </div>

    </div>


  </div>

</div>



<!-- ==================================
     ヒント2
================================== -->

<div class="hint">


  <button
    class="hint-header"
    onclick="toggleHint(this)"
  >

    <span>ヒント2</span>

    <span class="arrow">＋</span>

  </button>


  <div class="hint-content">

    <p>
      問題の中に繰り返し登場するものを探してみよう。
    </p>


    <div class="subhint">


      <button
        class="subhint-header"
        onclick="toggleSubHint(this)"
      >

        <span>もう少しヒント</span>

        <span class="subhint-arrow">＋</span>

      </button>


      <div class="subhint-content">

        <p>
          同じ文字が何度も出てきていないかな？
        </p>

      </div>

    </div>


    <div class="subhint">


      <button
        class="subhint-header"
        onclick="toggleSubHint(this)"
      >

        <span>さらにヒント</span>

        <span class="subhint-arrow">＋</span>

      </button>


      <div class="subhint-content">

        <p>
          その文字を抜き出してみよう。
        </p>

      </div>

    </div>


  </div>

</div>



<!-- ==================================
     ヒント3
================================== -->

<div class="hint">


  <button
    class="hint-header"
    onclick="toggleHint(this)"
  >

    <span>ヒント3</span>

    <span class="arrow">＋</span>

  </button>


  <div class="hint-content">

    <p>
      ここまでで分からなければ、別の角度から考えてみよう。
    </p>


    <div class="subhint">


      <button
        class="subhint-header"
        onclick="toggleSubHint(this)"
      >

        <span>もう少しヒント</span>

        <span class="subhint-arrow">＋</span>

      </button>


      <div class="subhint-content">

        <p>
          答えは「竹馬」に関係しているぞ。
        </p>

      </div>

    </div>


  </div>

</div>


</div>



<script>

/* ==================================
   大きなヒントの開閉
================================== */

function toggleHint(button){

  /* ボタンの親要素を取得 */

  var hint =
    button.parentElement;


  /* openを付けたり外したりする */

  hint.classList.toggle("open");


  /* ＋−を取得 */

  var arrow =
    button.querySelector(".arrow");


  /* 開いているか確認 */

  if(
    hint.classList.contains("open")
  ){

    arrow.textContent = "−";

  }else{

    arrow.textContent = "＋";

  }

}



/* ==================================
   ヒント内ヒントの開閉
================================== */

function toggleSubHint(button){

  /* ボタンの親要素を取得 */

  var subhint =
    button.parentElement;


  /* openを付けたり外したりする */

  subhint.classList.toggle("open");


  /* ＋−を取得 */

  var arrow =
    button.querySelector(".subhint-arrow");


  /* 開いているか確認 */

  if(
    subhint.classList.contains("open")
  ){

    arrow.textContent = "−";

  }else{

    arrow.textContent = "＋";

  }

}

</script>


</body>

</html>
