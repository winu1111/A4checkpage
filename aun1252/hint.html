<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>めぐる｜ヒント</title>


<style>

/* =========================
   全体
========================= */

body{
  margin:0;
  background:#ffffff;
  font-family:sans-serif;
  color:#333;
}

.wrapper{
  max-width:700px;
  margin:0 auto;
  padding:30px 20px;
}

.title{
  text-align:center;
  margin-bottom:30px;
}


/* =========================
   ヒントボックス
========================= */

.hint{
  margin-bottom:15px;

  border:2px solid #333;
  border-radius:12px;

  overflow:hidden;

  background:white;
}


/* ヒントのタイトル部分 */

.hint-header{

  width:100%;

  padding:18px 20px;

  box-sizing:border-box;

  background:#f5f5f5;

  border:none;

  font-size:18px;

  text-align:left;

  cursor:pointer;

  display:flex;

  justify-content:space-between;

  align-items:center;
}


/* ＋と− */

.arrow{
  font-size:20px;
}


/* =========================
   ヒントの中身
========================= */

.hint-content{

  max-height:0;

  overflow:hidden;

  transition:
    max-height 0.5s ease,
    padding 0.5s ease;

  padding:0 20px;
}


/* 開いている状態 */

.hint.open .hint-content{

  max-height:1000px;

  padding:20px;
}


/* =========================
   段階ヒント
========================= */

.subhint{

  margin-top:15px;
}


/* さらにヒントボタン */

.subhint-button{

  padding:10px 15px;

  border:1px solid #555;

  border-radius:8px;

  background:white;

  cursor:pointer;

  font-size:14px;
}


/* 段階ヒントの中身 */

.subhint-content{

  max-height:0;

  overflow:hidden;

  opacity:0;

  transition:
    max-height 0.4s ease,
    opacity 0.4s ease;

  margin-top:0;
}


/* 段階ヒントを開いた状態 */

.subhint.open .subhint-content{

  max-height:500px;

  opacity:1;

  margin-top:10px;
}


/* =========================
   スマホ
========================= */

@media screen and (max-width:768px){

  .wrapper{
    padding:20px 15px;
  }

  .hint-header{
    font-size:16px;
    padding:16px;
  }

  .hint.open .hint-content{
    padding:15px;
  }

}

</style>

</head>


<body>


<div class="wrapper">


<h1 class="title">
ヒント
</h1>


<!-- =====================
     ヒント1
===================== -->

<div class="hint">


  <button
    class="hint-header"
    onclick="toggleHint(this)"
  >

    <span>ヒント1</span>

    <span class="arrow">＋</span>

  </button>


  <div class="hint-content">

    <p>
      まずは問題文をもう一度よく読んでみよう。
    </p>


    <!-- 段階ヒント1 -->

    <div class="subhint">

      <button
        class="subhint-button"
        onclick="toggleSubHint(this)"
      >
        さらにヒントを見る
      </button>


      <div class="subhint-content">

        <p>
          特に文字の並び方に注目してみよう。
        </p>

      </div>

    </div>


    <!-- 段階ヒント2 -->

    <div class="subhint">

      <button
        class="subhint-button"
        onclick="toggleSubHint(this)"
      >
        さらにヒントを見る
      </button>


      <div class="subhint-content">

        <p>
          文字の形にも何か意味があるかもしれないぞ。
        </p>

      </div>

    </div>


  </div>

</div>



<!-- =====================
     ヒント2
===================== -->

<div class="hint">


  <button
    class="hint-header"
    onclick="toggleHint(this)"
  >

    <span>ヒント2</span>

    <span class="arrow">＋</span>

  </button>


  <div class="hint-content">

    <p>
      問題の中に繰り返し登場するものを探してみよう。
    </p>


    <div class="subhint">

      <button
        class="subhint-button"
        onclick="toggleSubHint(this)"
      >
        さらにヒントを見る
      </button>


      <div class="subhint-content">

        <p>
          同じ文字が何度も出てきていないかな？
        </p>

      </div>

    </div>


    <div class="subhint">

      <button
        class="subhint-button"
        onclick="toggleSubHint(this)"
      >
        さらにヒントを見る
      </button>


      <div class="subhint-content">

        <p>
          その文字を抜き出してみよう。
        </p>

      </div>

    </div>


  </div>

</div>



<!-- =====================
     ヒント3
===================== -->

<div class="hint">


  <button
    class="hint-header"
    onclick="toggleHint(this)"
  >

    <span>ヒント3</span>

    <span class="arrow">＋</span>

  </button>


  <div class="hint-content">

    <p>
      ここまでで分からなければ、別の角度から考えてみよう。
    </p>


    <div class="subhint">

      <button
        class="subhint-button"
        onclick="toggleSubHint(this)"
      >
        さらにヒントを見る
      </button>


      <div class="subhint-content">

        <p>
          答えは「竹馬」に関係しているぞ。
        </p>

      </div>

    </div>


  </div>

</div>


</div>



<script>

/* =========================
   大きなヒントを開閉
========================= */

function toggleHint(button){

  var hint =
    button.parentElement;

  hint.classList.toggle("open");


  var arrow =
    button.querySelector(".arrow");


  if(hint.classList.contains("open")){

    arrow.textContent="−";

  }else{

    arrow.textContent="＋";

  }

}


/* =========================
   段階ヒントを開閉
========================= */

function toggleSubHint(button){

  var subhint =
    button.parentElement;

  subhint.classList.toggle("open");


  if(subhint.classList.contains("open")){

    button.textContent="ヒントを閉じる";

  }else{

    button.textContent="さらにヒントを見る";

  }

}

</script>


</body>

</html>
